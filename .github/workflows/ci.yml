name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional surefire -Dtest selector; empty runs the full suite'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test:
    permissions:
      actions: write  # for styfle/cancel-workflow-action to cancel/stop running workflows
      contents: read  # for actions/checkout to fetch code
    name: "${{ matrix.root-pom }} on JDK ${{ matrix.java }} on ${{ matrix.os }}"
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        java: [ 8, 11, 17 ]
        root-pom: [ 'pom.xml', 'android/pom.xml' ]
        include:
          - os: windows-latest
            java: 17
            root-pom: pom.xml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      ROOT_POM: ${{ matrix.root-pom }}
    steps:
      # Cancel any previous runs for the same branch that are still running.
      - name: 'Cancel previous runs'
        uses: styfle/cancel-workflow-action@b173b6ec0100793626c2d9e6b90435061f4fc3e5
        with:
          access_token: ${{ github.token }}
      - name: 'Check out repository'
        uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab
      - name: 'Set up JDK ${{ matrix.java }}'
        uses: actions/setup-java@5ffc13f4174014e2d4d4572b3d74c3fa61aeb2c2

        with:
          java-version: ${{ matrix.java }}
          distribution: 'zulu'
          cache: 'maven'
      - name: 'Install'
        shell: bash
        run: mvn -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn install -U -DskipTests=true -f $ROOT_POM
      - name: 'Test'
        shell: bash
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn -B -P!standard-with-extra-repos verify -U -Dmaven.javadoc.skip=true -f $ROOT_POM -Dtest='${{ inputs.test-filter }}' -DfailIfNoTests=false
          else
            mvn -B -P!standard-with-extra-repos verify -U -Dmaven.javadoc.skip=true -f $ROOT_POM
          fi
      - name: 'Print skipped tests with reasons'
        if: ${{ always() }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=python; else PY=python3; fi
          cat > "$RUNNER_TEMP/skips.py" <<'PYEOF'
          import glob, os, re, xml.etree.ElementTree as ET
          base = os.path.dirname(os.environ["ROOT_POM"]) or "."
          srcs = {}
          def source_reason(module, method):
              if module not in srcs:
                  files = glob.glob(os.path.join(module, "test", "**", "*.java"), recursive=True)
                  srcs[module] = [(f, open(f, encoding="utf-8", errors="replace").read().splitlines()) for f in files]
              pat = re.compile(r"void\s+" + re.escape(method) + r"\s*\(")
              for f, lines in srcs[module]:
                  for i, line in enumerate(lines):
                      if pat.search(line):
                          for l in lines[i:i + 10]:
                              if "assume" in l:
                                  return "JUnit assumption not met: " + l.strip() + " (" + os.path.basename(f) + ")"
              return "no message recorded"
          total = 0
          for x in sorted(glob.glob(os.path.join(base, "*", "target", "surefire-reports", "TEST-*.xml"))):
              module = os.path.dirname(os.path.dirname(os.path.dirname(x)))
              for tc in ET.parse(x).getroot().iter("testcase"):
                  sk = tc.find("skipped")
                  if sk is None:
                      continue
                  total += 1
                  name = re.sub(r"\[.*$", "", tc.get("name", ""))
                  reason = sk.get("message") or source_reason(module, name)
                  print("SKIPPED %s.%s -- reason: %s" % (tc.get("classname"), tc.get("name"), reason))
          print("Total skipped tests: %d" % total)
          PYEOF
          $PY "$RUNNER_TEMP/skips.py"
      - name: 'Upload guava jar'
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.java == 11 && matrix.root-pom == 'pom.xml' }}
        uses: actions/upload-artifact@v4
        with:
          name: guava-jar
          path: guava/target/guava-*-jre.jar
          if-no-files-found: error
      - name: 'Print Surefire reports'
        # Note: Normally a step won't run if the job has failed, but this causes it to
        if: ${{ failure() }}
        shell: bash
        run: ./util/print_surefire_reports.sh

  publish_snapshot:
    name: 'Publish snapshot'
    needs: test
    if: github.event_name == 'push' && github.repository == 'google/guava'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab
      - name: 'Set up JDK 11'
        uses: actions/setup-java@5ffc13f4174014e2d4d4572b3d74c3fa61aeb2c2

        with:
          java-version: 11
          distribution: 'zulu'
          server-id: sonatype-nexus-snapshots
          server-username: CI_DEPLOY_USERNAME
          server-password: CI_DEPLOY_PASSWORD
          cache: 'maven'
      - name: 'Publish'
        env:
          CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
          CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
        run: ./util/deploy_snapshot.sh

  generate_docs:
    permissions:
      contents: write
    name: 'Generate latest docs'
    needs: test
    if: github.event_name == 'push' && github.repository == 'google/guava'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab
      - name: 'Set up JDK 11'
        uses: actions/setup-java@5ffc13f4174014e2d4d4572b3d74c3fa61aeb2c2

        with:
          java-version: 11
          distribution: 'zulu'
          cache: 'maven'
      - name: 'Generate latest docs'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./util/update_snapshot_docs.sh
